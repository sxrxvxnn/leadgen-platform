<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Background: rounded yellow square -->
  <rect width="400" height="400" rx="72" ry="72" fill="#FFFF00"/>

  <!-- Sonar rings -->
  <circle cx="200" cy="200" r="148" stroke="#121212" stroke-width="12" fill="none"/>
  <circle cx="200" cy="200" r="94" stroke="#121212" stroke-width="12" fill="none"/>
  <circle cx="200" cy="200" r="40" stroke="#121212" stroke-width="12" fill="none"/>

  <!-- Center dot -->
