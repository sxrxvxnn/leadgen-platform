  <!-- Crosshair lines -->
  <line x1="200" y1="8" x2="200" y2="54" stroke="#121212" stroke-width="12" stroke-linecap="square"/>
  <line x1="200" y1="346" x2="200" y2="392" stroke="#121212" stroke-width="12" stroke-linecap="square"/>
  <line x1="8" y1="200" x2="54" y2="200" stroke="#121212" stroke-width="12" stroke-linecap="square"/>
  <line x1="346" y1="200" x2="392" y2="200" stroke="#121212" stroke-width="12" stroke-linecap="square"/>
