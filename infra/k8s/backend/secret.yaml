# Secret template — DO NOT commit real values.
# Create with: kubectl create secret generic leadgen-backend-secrets -n leadgen \
#   --from-literal=SUPABASE_URL='...' \
#   --from-literal=SUPABASE_KEY='...' \
#   --from-literal=POSTHOG_PROJECT_TOKEN='...' \
#   --from-literal=GOOGLE_MAPS_API_KEY='...'
#
# Or seal with kubeseal and commit the SealedSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: leadgen-backend-secrets
  namespace: leadgen
type: Opaque
stringData:
  SUPABASE_URL: "REPLACE_ME"
  SUPABASE_KEY: "REPLACE_ME"
  POSTHOG_PROJECT_TOKEN: "REPLACE_ME"
  GOOGLE_MAPS_API_KEY: "REPLACE_ME"
  POSTHOG_HOST: "https://us.i.posthog.com"
