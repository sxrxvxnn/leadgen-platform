apiVersion: v1
kind: ConfigMap
metadata:
  name: leadgen-backend-config
  namespace: leadgen
data:
  # App config — non-secret values only
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  WORKERS: "2"
  PORT: "8000"
  AWS_REGION: "us-east-1"

  # SQS queue URLs — created by infra/sqs-setup.sh
  SQS_BULK_ENRICHMENT_URL: ""     # fill after queue creation
  SQS_BULK_MAPS_ENRICH_URL: ""   # fill after queue creation
  SQS_BULK_ANALYZE_URL: ""       # fill after queue creation
  SQS_BATCH_DM_URL: ""           # fill after queue creation
