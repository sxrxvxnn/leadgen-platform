<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <!-- Background -->
  <rect width="1584" height="396" fill="#121212"/>

  <!-- Yellow accent bar top -->
  <rect x="0" y="0" width="1584" height="4" fill="#FFFF00"/>

  <!-- Grid dot pattern (subtle) -->
  <defs>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2A2A2A"/>
    </pattern>
  </defs>
  <rect width="1584" height="396" fill="url(#dots)"/>

  <!-- Left: Logo mark -->
  <rect x="64" y="120" width="80" height="80" rx="14" ry="14" fill="#FFFF00"/>
  <circle cx="104" cy="160" r="30" stroke="#121212" stroke-width="5" fill="none"/>
  <circle cx="104" cy="160" r="18" stroke="#121212" stroke-width="5" fill="none"/>
  <circle cx="104" cy="160" r="7" fill="#121212"/>
  <line x1="104" y1="128" x2="104" y2="138" stroke="#121212" stroke-width="4" stroke-linecap="square"/>
  <line x1="104" y1="182" x2="104" y2="192" stroke="#121212" stroke-width="4" stroke-linecap="square"/>
  <line x1="72" y1="160" x2="82" y2="160" stroke="#121212" stroke-width="4" stroke-linecap="square"/>
  <line x1="126" y1="160" x2="136" y2="160" stroke="#121212" stroke-width="4" stroke-linecap="square"/>

  <!-- Brand name -->
  <text x="168" y="178" font-family="'Arial Narrow', 'Arial', sans-serif" font-weight="700" font-size="72" letter-spacing="8" text-anchor="start" fill="#F5F5F5" text-rendering="optimizeLegibility">SONAR</text>

  <!-- Tagline -->
  <text x="168" y="222" font-family="'Arial', sans-serif" font-weight="400" font-size="18" letter-spacing="3" text-anchor="start" fill="#5B6670" text-rendering="optimizeLegibility">B2B LEAD INTELLIGENCE PLATFORM</text>

  <!-- Divider -->
  <line x1="64" y1="270" x2="680" y2="270" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Bottom tagline -->
  <text x="64" y="304" font-family="'Arial', sans-serif" font-weight="400" font-size="15" letter-spacing="2" fill="#5B6670" text-rendering="optimizeLegibility">DISCOVER · ENRICH · CONVERT</text>

  <!-- Right: Large sonar rings -->
  <circle cx="1320" cy="198" r="280" stroke="#1E1E1E" stroke-width="1" fill="none"/>
  <circle cx="1320" cy="198" r="220" stroke="#222222" stroke-width="1" fill="none"/>
  <circle cx="1320" cy="198" r="160" stroke="#282828" stroke-width="1.5" fill="none"/>
  <circle cx="1320" cy="198" r="100" stroke="#2E2E2E" stroke-width="2" fill="none"/>
  <circle cx="1320" cy="198" r="52" stroke="#FFFF00" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="1320" cy="198" r="20" fill="#FFFF00" opacity="0.9"/>
  <circle cx="1320" cy="198" r="8" fill="#121212"/>

  <!-- Crosshairs on right globe -->
  <line x1="1320" y1="0" x2="1320" y2="396" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="980" y1="198" x2="1584" y2="198" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Yellow accent dot small -->
  <circle cx="1160" cy="198" r="4" fill="#FFFF00" opacity="0.5"/>
  <circle cx="1480" cy="198" r="4" fill="#FFFF00" opacity="0.5"/>
</svg>
