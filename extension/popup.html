<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #FFFFFF;
      --surface:      #F9FAFB;
      --surface2:     #F3F4F6;
      --text:         #0A0A0A;
      --text-soft:    #374151;
      --text-muted:   #6B7280;
      --border:       #E5E7EB;
      --border-mid:   #D1D5DB;
      --accent:       #E7000B;
      --accent-dim:   rgba(231,0,11,0.08);
      --accent-light: rgba(231,0,11,0.25);
      --green:        #22C55E;
      --red:          #EF4444;
    }

    body {
      width: 340px;
      min-height: 460px;
      background: var(--bg);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      border-radius: 12px;
      overflow: hidden;
    }

    a { text-decoration: none; color: inherit; }

    /* ── Screens ───────────────────────────────────────────── */
    .screen { display: none; padding: 0; }
    .screen.active { display: flex; flex-direction: column; min-height: 460px; }

    /* ── Header ────────────────────────────────────────────── */
    .sl-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px 13px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .sl-logo {
      width: 26px;
      height: 26px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sl-logo svg { width: 14px; height: 14px; }
    .sl-logo svg circle { stroke: #FFFFFF !important; }
    .sl-logo svg circle[r="1.5"] { fill: #FFFFFF !important; stroke: none !important; }
    .sl-logo svg line { stroke: #FFFFFF !important; }
    .sl-brand {
      font-family: 'Arial Narrow', Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }
    .sl-status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border);
      margin-left: auto;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .sl-status-dot.online { background: var(--green); }

    /* ── Body ──────────────────────────────────────────────── */
    .sl-body { padding: 18px; flex: 1; display: flex; flex-direction: column; gap: 12px; }

    /* Lead count strip */
    .sl-lead-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .sl-lead-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .sl-lead-count {
      font-family: 'SF Mono', ui-monospace, 'Cascadia Code', monospace;
      font-size: 13px;
      font-weight: 400;
      color: var(--accent);
    }

    /* Page badge */
    .sl-page-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      width: fit-content;
    }
    .sl-page-badge.linkedin { border-color: #0077b5; }
    .sl-badge-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--border-mid);
      flex-shrink: 0;
    }
    .sl-page-badge.linkedin .sl-badge-dot { background: #0077b5; }
    #pageTypeLabel {
      font-family: 'SF Mono', ui-monospace, monospace;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .sl-page-badge.linkedin #pageTypeLabel { color: #0077b5; }

    /* Status message */
    .sl-status-msg {
      font-size: 12px;
      line-height: 1.5;
      padding: 9px 12px;
      border-radius: 8px;
      display: none;
      border: 1px solid transparent;
    }
    .sl-status-msg.show { display: block; }
    .sl-status-msg.success {
      background: rgba(34,197,94,0.07);
      border-color: rgba(34,197,94,0.20);
      color: var(--green);
    }
    .sl-status-msg.error {
      background: rgba(239,68,68,0.07);
      border-color: rgba(239,68,68,0.18);
      color: var(--red);
    }

    /* Tip */
    .sl-tip {
      display: none;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.55;
      padding: 8px 10px;
      background: var(--surface);
      border-radius: 8px;
      border-left: 2px solid var(--border-mid);
    }

    /* ── Buttons ───────────────────────────────────────────── */

    /* Primary — red fill */
    .sl-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #FFFFFF;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.2s, transform 0.15s;
      text-align: left;
      animation: sl-fade-in 0.3s ease 0.15s both;
    }
    .sl-btn:hover:not(:disabled) {
      background: #C50009;
      box-shadow: 0 0 14px rgba(231,0,11,0.18);
      transform: translateY(-1px);
    }
    .sl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Accent — red outline */
    .sl-btn-accent {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(231,0,11,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.2s, transform 0.15s;
      text-align: left;
    }
    .sl-btn-accent:hover:not(:disabled) {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(231,0,11,0.10);
      transform: translateY(-1px);
    }
    .sl-btn-accent:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Ghost */
    .sl-btn-ghost {
      width: 100%;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sl-btn-ghost:hover:not(:disabled) { border-color: var(--border-mid); color: var(--text-soft); }
    .sl-btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Text link button */
    .sl-btn-link {
      background: none;
      border: none;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
      text-align: left;
    }
    .sl-btn-link:hover { color: var(--text); }

    /* ── Divider ───────────────────────────────────────────── */
    .sl-divider { height: 1px; background: var(--border); }

    /* ── Footer ────────────────────────────────────────────── */
    .sl-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 18px 14px;
      border-top: 1px solid var(--border);
    }

    /* ── Login form ────────────────────────────────────────── */
    .sl-login-body { padding: 28px 18px; flex: 1; display: flex; flex-direction: column; }
    .sl-login-headline {
      font-family: 'Arial Narrow', Arial, sans-serif;
      font-weight: 700;
      font-size: 36px;
      line-height: 1.0;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 6px;
    }
    .sl-login-headline span { color: var(--accent); }
    .sl-login-sub {
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .sl-field { margin-bottom: 12px; }
    .sl-label {
      display: block;
      font-family: ui-monospace, 'SF Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .sl-input {
      width: 100%;
      padding: 9px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .sl-input::placeholder { color: var(--text-muted); }
    .sl-input:focus { border-color: var(--accent); }
    .sl-error-msg {
      font-size: 11px;
      color: var(--red);
      margin-bottom: 12px;
      display: none;
      padding: 7px 10px;
      background: rgba(239,68,68,0.06);
      border: 1px solid rgba(239,68,68,0.16);
      border-radius: 8px;
    }
    .sl-error-msg.show { display: block; }

    /* hide by default, shown via JS */
    #enrichProfileBtn { display: none; }
    #autoScrollBtn    { display: none; }
    #peopleTip        { display: none; }

    /* ── Animations ───────────────────────────────────────────── */
    @keyframes sl-fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .sl-body, .sl-login-body { animation: sl-fade-in 0.25s ease both; }
    .sl-lead-strip { animation: sl-fade-in 0.3s ease 0.05s both; }
    .sl-page-badge { animation: sl-fade-in 0.3s ease 0.10s both; }
  </style>
</head>
<body>

  <!-- ── LOGIN SCREEN ──────────────────────────────────────── -->
  <div class="screen active" id="loginScreen">
    <div class="sl-header">
      <div class="sl-logo">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="7" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>
          <circle cx="8" cy="8" r="4" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85"/>
          <circle cx="8" cy="8" r="1.5" fill="#FFFFFF"/>
          <line x1="9.1" y1="6.9" x2="13" y2="3" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="sl-brand">Sonar</span>
      <div class="sl-status-dot" id="statusDotLogin"></div>
    </div>

    <div class="sl-login-body">
      <h1 class="sl-login-headline">Sign<br /><span>in.</span></h1>
      <p class="sl-login-sub">Connect to your Sonar dashboard</p>

      <div class="sl-error-msg" id="loginError"></div>

      <div class="sl-field">
        <label class="sl-label" for="loginEmail">Email</label>
        <input class="sl-input" type="email" id="loginEmail" placeholder="you@company.com" autocomplete="email" />
      </div>
      <div class="sl-field">
        <label class="sl-label" for="loginPassword">Password</label>
        <input class="sl-input" type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="sl-btn" id="loginBtn" style="margin-top: 8px;">
        <span>Sign in</span>
        <span>→</span>
      </button>
    </div>
  </div>

  <!-- ── MAIN SCREEN ───────────────────────────────────────── -->
  <div class="screen" id="mainScreen">
    <div class="sl-header">
      <div class="sl-logo">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="7" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>
          <circle cx="8" cy="8" r="4" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85"/>
          <circle cx="8" cy="8" r="1.5" fill="#FFFFFF"/>
          <line x1="9.1" y1="6.9" x2="13" y2="3" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="sl-brand">Sonar</span>
      <div class="sl-status-dot" id="statusDot"></div>
    </div>

    <div class="sl-body">

      <!-- Lead count -->
      <div class="sl-lead-strip">
        <span class="sl-lead-label">Leads synced</span>
        <span class="sl-lead-count" id="leadCount">—</span>
      </div>

      <!-- Page detection badge -->
      <div class="sl-page-badge" id="pageBadge">
        <div class="sl-badge-dot"></div>
        <span id="pageTypeLabel">DETECTING PAGE…</span>
      </div>

      <!-- Status messages -->
      <div class="sl-status-msg" id="statusMsg"></div>

      <!-- People page tip -->
      <p class="sl-tip" id="peopleTip">
        Visit the company page first to capture size &amp; followers, then return here to extract people.
      </p>

      <!-- Update existing lead (shown only on a profile that's already a lead) -->
      <button class="sl-btn-accent" id="enrichProfileBtn">
        <span>Update this lead with full profile</span>
        <span>↑</span>
      </button>

      <!-- Auto-scroll (company people pages only) -->
      <button class="sl-btn-ghost" id="autoScrollBtn">
        <span>Auto-scroll to load all profiles</span>
        <span>↓</span>
      </button>

      <!-- Main extract -->
      <button class="sl-btn" id="extractBtn" disabled>
        <span>Extract leads from page</span>
        <span>→</span>
      </button>

    </div>

    <div class="sl-footer">
      <button class="sl-btn-link" id="dashboardBtn">Open dashboard →</button>
      <button class="sl-btn-link" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
