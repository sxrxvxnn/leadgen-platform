<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeadGen Engine</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 320px;
        min-height: 200px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #ffffff;
        color: #1a1a1a;
        padding: 16px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #f0f0f0;
      }

      .logo {
        width: 24px;
        height: 24px;
        background: #2563eb;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 12px;
        font-weight: 700;
      }

      .header h1 {
        font-size: 14px;
        font-weight: 600;
        color: #1a1a1a;
      }

      .page-type {
        font-size: 11px;
        color: #6b7280;
        margin-bottom: 12px;
      }

      .page-type span {
        background: #eff6ff;
        color: #2563eb;
        padding: 2px 8px;
        border-radius: 99px;
        font-weight: 500;
      }

      .btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s;
        margin-bottom: 8px;
      }

      .btn:hover { opacity: 0.85; }
      .btn:active { opacity: 0.7; }

      .btn-primary {
        background: #2563eb;
        color: white;
      }

      .btn-secondary {
        background: #f3f4f6;
        color: #374151;
      }

      .status {
        font-size: 12px;
        padding: 8px 10px;
        border-radius: 6px;
        margin-top: 8px;
        display: none;
      }

      .status.success {
        background: #f0fdf4;
        color: #166534;
        display: block;
      }

      .status.error {
        background: #fef2f2;
        color: #991b1b;
        display: block;
      }

      .lead-count {
        font-size: 12px;
        color: #6b7280;
        text-align: center;
        margin-top: 10px;
      }

      .lead-count strong {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">L</div>
      <h1>LeadGen Engine</h1>
    </div>

    <p class="page-type">
      Page: <span id="pageType">Detecting...</span>
    </p>

    <button class="btn btn-primary" id="scrapeBtn">
      Extract Leads from This Page
    </button>

    <button class="btn btn-secondary" id="viewBtn">
      View Saved Leads
    </button>

    <div class="status" id="status"></div>

    <p class="lead-count" id="leadCount"></p>

    <script src="popup.js"></script>
  </body>
</html>
