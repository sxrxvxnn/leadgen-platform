<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #fffcfc;
      --surface:      #ecedf2;
      --text:         #01011b;
      --text-soft:    #31263b;
      --text-muted:   #717a94;
      --border:       #dbd7da;
      --border-strong:#31263b;
      --accent:       #6f63b7;
      --accent-dark:  #473982;
      --accent-light: #9e91d6;
      --accent-dim:   rgba(111,99,183,0.10);
      --green:        #2e7d4f;
      --red:          #b83232;
      --shadow:
        rgba(49,38,59,0.18) 0px 0px 0px 1px,
        rgba(49,38,59,0.08) 0px 8px 24px 0px;
    }

    body {
      width: 340px;
      min-height: 460px;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }

    /* ── Screens ───────────────────────────────────────────── */
    .screen { display: none; padding: 0; }
    .screen.active { display: flex; flex-direction: column; min-height: 460px; }

    /* ── Header ────────────────────────────────────────────── */
    .sl-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .sl-logo {
      width: 28px;
      height: 28px;
      background: var(--text);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sl-logo svg { width: 16px; height: 16px; }
    .sl-brand {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
      letter-spacing: -0.2px;
    }
    .sl-status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border);
      margin-left: auto;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .sl-status-dot.online { background: var(--green); }

    /* ── Body ──────────────────────────────────────────────── */
    .sl-body { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 16px; }

    /* Lead count strip */
    .sl-lead-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .sl-lead-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
    .sl-lead-count {
      font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
      font-size: 13px;
      font-weight: 400;
      color: var(--text);
    }

    /* Page badge */
    .sl-page-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 9999px;
      background: transparent;
      width: fit-content;
    }
    .sl-page-badge.linkedin { border-color: #0077b5; }
    .sl-badge-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }
    .sl-page-badge.linkedin .sl-badge-dot { background: #0077b5; }
    #pageTypeLabel {
      font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .sl-page-badge.linkedin #pageTypeLabel { color: #0077b5; }

    /* Status message */
    .sl-status-msg {
      font-size: 12px;
      line-height: 1.5;
      padding: 9px 12px;
      border-radius: 5px;
      display: none;
      border: 1px solid transparent;
    }
    .sl-status-msg.show { display: block; }
    .sl-status-msg.success {
      background: rgba(46,125,79,0.07);
      border-color: rgba(46,125,79,0.20);
      color: var(--green);
    }
    .sl-status-msg.error {
      background: rgba(184,50,50,0.07);
      border-color: rgba(184,50,50,0.18);
      color: var(--red);
    }

    /* Tip */
    .sl-tip {
      display: none;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.55;
      padding: 8px 10px;
      background: var(--surface);
      border-radius: 5px;
      border-left: 2px solid var(--accent-light);
    }

    /* ── Buttons ───────────────────────────────────────────── */

    /* Primary outlined (never filled — brand rule) */
    .sl-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-weight: 500;
      font-size: 13px;
      color: var(--text);
      background: #ffffff;
      border: 1px solid var(--border-strong);
      border-radius: 3px;
      padding: 10px 14px;
      cursor: pointer;
      transition: border-width 120ms ease, padding 120ms ease;
      text-align: left;
    }
    .sl-btn:hover:not(:disabled) {
      border: 2px solid var(--text);
      padding: 9px 13px;
    }
    .sl-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Accent outlined (for enrich/update) */
    .sl-btn-accent {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-weight: 500;
      font-size: 13px;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid var(--accent-light);
      border-radius: 3px;
      padding: 10px 14px;
      cursor: pointer;
      transition: border-width 120ms ease, padding 120ms ease;
      text-align: left;
    }
    .sl-btn-accent:hover:not(:disabled) {
      border: 2px solid var(--accent);
      padding: 9px 13px;
    }
    .sl-btn-accent:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Ghost (auto-scroll, secondary actions) */
    .sl-btn-ghost {
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-weight: 500;
      font-size: 12px;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 9px 14px;
      cursor: pointer;
      transition: border-color 120ms ease, color 120ms ease;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sl-btn-ghost:hover:not(:disabled) { border-color: var(--text-muted); color: var(--text); }
    .sl-btn-ghost:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Text link button */
    .sl-btn-link {
      background: none;
      border: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      letter-spacing: 0.02em;
      transition: color 120ms ease;
      text-align: left;
    }
    .sl-btn-link:hover { color: var(--text); }

    /* ── Divider ───────────────────────────────────────────── */
    .sl-divider { height: 1px; background: var(--border); }

    /* ── Footer ────────────────────────────────────────────── */
    .sl-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 16px;
      border-top: 1px solid var(--border);
    }

    /* ── Login form ────────────────────────────────────────── */
    .sl-login-body { padding: 24px 20px; flex: 1; display: flex; flex-direction: column; }
    .sl-login-headline {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 6px;
    }
    .sl-login-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .sl-field { margin-bottom: 14px; }
    .sl-label {
      display: block;
      font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .sl-input {
      width: 100%;
      padding: 9px 12px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    .sl-input:focus {
      border-color: var(--accent-light);
      box-shadow: 0 0 0 3px rgba(71,57,130,0.10);
    }
    .sl-error-msg {
      font-size: 11px;
      color: var(--red);
      margin-bottom: 12px;
      display: none;
      padding: 7px 10px;
      background: rgba(184,50,50,0.06);
      border: 1px solid rgba(184,50,50,0.16);
      border-radius: 4px;
    }
    .sl-error-msg.show { display: block; }

    /* hide by default, shown via JS */
    #enrichProfileBtn { display: none; }
    #autoScrollBtn    { display: none; }
    #peopleTip        { display: none; }
  </style>
</head>
<body>

  <!-- ── LOGIN SCREEN ──────────────────────────────────────── -->
  <div class="screen active" id="loginScreen">
    <div class="sl-header">
      <div class="sl-logo">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="7" stroke="#fffcfc" stroke-width="1.2" opacity="0.3"/>
          <circle cx="8" cy="8" r="4" stroke="#fffcfc" stroke-width="1.2" opacity="0.65"/>
          <circle cx="8" cy="8" r="1.5" fill="#fffcfc"/>
          <line x1="9.1" y1="6.9" x2="13" y2="3" stroke="#fffcfc" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="sl-brand">Sonar</span>
      <div class="sl-status-dot" id="statusDotLogin"></div>
    </div>

    <div class="sl-login-body">
      <h1 class="sl-login-headline">Sign in.</h1>
      <p class="sl-login-sub">Connect to your Sonar dashboard</p>

      <div class="sl-error-msg" id="loginError"></div>

      <div class="sl-field">
        <label class="sl-label" for="loginEmail">Email</label>
        <input class="sl-input" type="email" id="loginEmail" placeholder="you@company.com" autocomplete="email" />
      </div>
      <div class="sl-field">
        <label class="sl-label" for="loginPassword">Password</label>
        <input class="sl-input" type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="sl-btn" id="loginBtn" style="margin-top: 8px;">
        <span>Sign in</span>
        <span>→</span>
      </button>
    </div>
  </div>

  <!-- ── MAIN SCREEN ───────────────────────────────────────── -->
  <div class="screen" id="mainScreen">
    <div class="sl-header">
      <div class="sl-logo">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="7" stroke="#fffcfc" stroke-width="1.2" opacity="0.3"/>
          <circle cx="8" cy="8" r="4" stroke="#fffcfc" stroke-width="1.2" opacity="0.65"/>
          <circle cx="8" cy="8" r="1.5" fill="#fffcfc"/>
          <line x1="9.1" y1="6.9" x2="13" y2="3" stroke="#fffcfc" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="sl-brand">Sonar</span>
      <div class="sl-status-dot" id="statusDot"></div>
    </div>

    <div class="sl-body">

      <!-- Lead count -->
      <div class="sl-lead-strip">
        <span class="sl-lead-label">Leads synced</span>
        <span class="sl-lead-count" id="leadCount">—</span>
      </div>

      <!-- Page detection badge -->
      <div class="sl-page-badge" id="pageBadge">
        <div class="sl-badge-dot"></div>
        <span id="pageTypeLabel">DETECTING PAGE…</span>
      </div>

      <!-- Status messages -->
      <div class="sl-status-msg" id="statusMsg"></div>

      <!-- People page tip -->
      <p class="sl-tip" id="peopleTip">
        Visit the company page first to capture size &amp; followers, then return here to extract people.
      </p>

      <!-- Update existing lead (shown only on a profile that's already a lead) -->
      <button class="sl-btn-accent" id="enrichProfileBtn">
        <span>Update this lead with full profile</span>
        <span>↑</span>
      </button>

      <!-- Auto-scroll (company people pages only) -->
      <button class="sl-btn-ghost" id="autoScrollBtn">
        <span>Auto-scroll to load all profiles</span>
        <span>↓</span>
      </button>

      <!-- Main extract -->
      <button class="sl-btn" id="extractBtn" disabled>
        <span>Extract leads from page</span>
        <span>→</span>
      </button>

    </div>

    <div class="sl-footer">
      <button class="sl-btn-link" id="dashboardBtn">Open dashboard →</button>
      <button class="sl-btn-link" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
