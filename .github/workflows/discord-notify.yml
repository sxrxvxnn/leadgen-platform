name: Discord Notifications

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed, reopened]
    branches: [main]

jobs:
  # ── #engineering ─────────────────────────────────────────────────────────────

  notify-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy started
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
          AUTHOR="${{ github.event.head_commit.author.name }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 Deploying to production\",
                \"description\": \"**${COMMIT_MSG}**\",
                \"color\": 15138560,
                \"fields\": [
                  { \"name\": \"Author\", \"value\": \"${AUTHOR}\", \"inline\": true },
                  { \"name\": \"Commit\", \"value\": \"[\`${SHORT_SHA}\`](${REPO_URL}/commit/${{ github.sha }})\", \"inline\": true },
                  { \"name\": \"Live at\", \"value\": \"[sonarleads.vercel.app](https://sonarleads.vercel.app)\", \"inline\": true }
                ],
                \"footer\": { \"text\": \"Vercel auto-deploy triggered\" }
              }]
            }"

  notify-deploy-done:
    if: github.event_name == 'push'
    needs: notify-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel
        run: sleep 60

      - name: Deploy complete
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"✅ Deploy complete\",
                \"description\": \"**${COMMIT_MSG}**\",
                \"color\": 5763719,
                \"fields\": [
                  { \"name\": \"Live at\", \"value\": \"[sonarleads.vercel.app](https://sonarleads.vercel.app)\", \"inline\": true },
                  { \"name\": \"Commit\", \"value\": \"\`${SHORT_SHA}\`\", \"inline\": true }
                ],
                \"footer\": { \"text\": \"Sonar · Production\" }
              }]
            }"

  notify-pr-opened:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: PR opened
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"📬 PR #${PR_NUMBER}: ${PR_TITLE}\",
                \"url\": \"${PR_URL}\",
                \"description\": \"Opened by **${AUTHOR}** — review needed\",
                \"color\": 5814783
              }]
            }"

  notify-pr-merged:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: PR merged
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          AUTHOR="${{ github.event.pull_request.merged_by.login }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🔀 PR #${PR_NUMBER} merged\",
                \"url\": \"${PR_URL}\",
                \"description\": \"**${PR_TITLE}**\nMerged by **${AUTHOR}**\",
                \"color\": 10181046
              }]
            }"

  # ── #design ──────────────────────────────────────────────────────────────────

  notify-design:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for UI file changes
        id: ui-check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E \
            '(dashboard/src/pages/Landing\.|dashboard/src/components/|dashboard/src/.*\.css)' \
            || true)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            FILES=$(echo "$CHANGED" | head -6 | sed 's|.*/||' | paste -sd ', ')
            echo "files=$FILES" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Design change notification
        if: steps.ui-check.outputs.changed == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DESIGN_WEBHOOK_URL }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
          AUTHOR="${{ github.event.head_commit.author.name }}"
          FILES="${{ steps.ui-check.outputs.files }}"

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🎨 UI updated\",
                \"description\": \"**${COMMIT_MSG}**\",
                \"color\": 10181046,
                \"fields\": [
                  { \"name\": \"Changed\", \"value\": \"\`${FILES}\`\", \"inline\": false },
                  { \"name\": \"Author\", \"value\": \"${AUTHOR}\", \"inline\": true },
                  { \"name\": \"Preview\", \"value\": \"[sonarleads.vercel.app](https://sonarleads.vercel.app)\", \"inline\": true }
                ],
                \"footer\": { \"text\": \"\`${SHORT_SHA}\` · Sonar\" }
              }]
            }"

  # ── #product ─────────────────────────────────────────────────────────────────

  notify-product:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check for feature commit
        id: feat-check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if echo "$COMMIT_MSG" | grep -qiE '^feat(\(.+\))?:'; then
            echo "is_feat=true" >> $GITHUB_OUTPUT
          else
            echo "is_feat=false" >> $GITHUB_OUTPUT
          fi

      - name: Feature shipped notification
        if: steps.feat-check.outputs.is_feat == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_PRODUCT_WEBHOOK_URL }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
          AUTHOR="${{ github.event.head_commit.author.name }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"📦 New feature shipped\",
                \"description\": \"**${COMMIT_MSG}**\",
                \"color\": 5763719,
                \"fields\": [
                  { \"name\": \"Shipped by\", \"value\": \"${AUTHOR}\", \"inline\": true },
                  { \"name\": \"Live at\", \"value\": \"[sonarleads.vercel.app](https://sonarleads.vercel.app)\", \"inline\": true },
                  { \"name\": \"Diff\", \"value\": \"[View commit](${REPO_URL}/commit/${{ github.sha }})\", \"inline\": true }
                ],
                \"footer\": { \"text\": \"\`${SHORT_SHA}\` · Sonar\" }
              }]
            }"
